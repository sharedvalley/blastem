name: Web (emscripten)

on:
  push:
    branches: [libretro]
    tags: ['web-v*']
  pull_request:
    branches: [libretro]
  workflow_dispatch:

permissions:
  contents: write

env:
  EMSDK_VERSION: 6.0.13
  R2_BUCKET: blastem-builds
  R2_ENDPOINT: https://e200dc7bdd387bbe00c8829f4bf0cd9d.r2.cloudflarestorage.com
  CDN_URL: https://cdn.sharedvalley.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versions are immutable on the CDN: the website pins one, so a tag can't be published twice
      - name: Check the release version
        if: github.ref_type == 'tag'
        run: |
          VERSION=${GITHUB_REF_NAME#web-v}
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not web-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if curl -fsI "$CDN_URL/blastem/$VERSION/blastem.js" >/dev/null; then
            echo "::error::$VERSION is already published"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i -E "s/define BLASTEM_VERSION \"[^\"]*\"/define BLASTEM_VERSION \"web-$VERSION\"/" version.inc

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Generate the 68K and Z80 cores
        run: make CC=emcc CPU=wasm m68k.c z80.c -j2

      - name: Build blastem.js and blastem.wasm
        run: make CC=emcc CPU=wasm blastem.html -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: blastem-web
          path: |
            blastem.js
            blastem.wasm

      # A rolling release the website can download from; it does not deploy the site.
      - name: Update the web-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/libretro'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-latest >/dev/null 2>&1 || \
            gh release create web-latest --prerelease --title "BlastEm web (latest libretro)" \
              --notes "blastem.js and blastem.wasm from the latest push to libretro."
          gh release upload web-latest blastem.js blastem.wasm --clobber

      # Gzipped because uncompressed the wasm is over the 25 MiB Workers static asset limit, and
      # without Content-Encoding so the website decompresses it the same way wherever it's served from
      - name: Publish to the CDN
        if: github.ref_type == 'tag'
        env:
          # A bucket-scoped R2 token: those only work with the S3 API
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the checksums newer AWS CLIs send by default
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          gzip -9 -n -k blastem.wasm
          put() {
            aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "blastem/$1" \
              --body "$2" --content-type "$3" --cache-control "$4" >/dev/null
          }
          immutable="public, max-age=31536000, immutable"
          put "$VERSION/blastem.js" blastem.js application/javascript "$immutable"
          put "$VERSION/blastem.wasm.gz" blastem.wasm.gz application/octet-stream "$immutable"
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg date "$(date -u +%FT%TZ)" \
            '{version: $version, commit: $commit, date: $date}' > latest.json
          put latest.json latest.json application/json no-cache
          echo "Published $CDN_URL/blastem/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" blastem.js blastem.wasm --title "BlastEm web $VERSION" --generate-notes
